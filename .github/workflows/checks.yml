name: Repository and Step 1-3 checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --no-deps .
      - run: make check
      - run: python -m iaa_hackathon --help
  step1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements/step1-py312.lock
      - run: python -m pip install --no-deps .
      - run: make step1-check
  step2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements/step2-py312.lock
      - run: python -m pip install --no-deps .
      - run: make step2-check
  step3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements/step3-py312.lock
      - run: python -m pip install --no-deps .
      - run: make step3-check
